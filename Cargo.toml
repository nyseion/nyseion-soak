[workspace]
members = ["nyseion-soak", "udp-impair"]
resolver = "3"

[workspace.package]
authors = ["Vincent Mele <vince@mele.law>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nyseion/nyseion-soak"
version = "0.1.0"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
codegen-units = 1
debug = "line-tables-only"
